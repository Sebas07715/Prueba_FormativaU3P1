
{% extends "base.html" %}
{% block contenido %}
<h1>Películas en Cartelera</h1>
<form method="get" style="margin-bottom: 20px;">
<input type="text" name="q" placeholder="Buscar por título..." value="{{ q }}">
<select name="genero">
<option value="">Todos los géneros</option>
{% for g in generos %}
<option value="{{ g.id }}" {% if genero_sel == g.id %}selected{% endif %}>{{ g.nombre }}
</option>
{% endfor %}
</select>
<button type="submit">Filtrar</button>
</form>
<div class="grid">
    {% for p in peliculas %}
<div class="card">
    {% if p.afiche %}<img src="{{ p.afiche.url }}" alt="{{ p.titulo }}">{% endif %}
    <h3>{{ p.titulo }}</h3>
    <p><small>{{ p.genero.nombre }}</small></p>
    <p><strong>{{ p.precio_chileno }}</strong></p>
    <a href="{% url 'cartelera:detalle_pelicula' p.id %}">Ver detalle</a>
</div>
{% empty %}
<p>No hay películas disponibles con esos filtros.</p>
{% endfor %}
</div>
{% endblock %}
